
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>AI Image Studio</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #09090d;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 22px 16px;
}

.container {
  max-width: 480px;
  margin: auto;
}

header {
  text-align: center;
  padding: 22px 0 30px;
}

.logo {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #a855f7;
}

.subtitle {
  color: #888;
  font-size: 12px;
  margin-top: 9px;
  letter-spacing: 2px;
}

.card {
  background: #14141d;
  border: 1px solid #292936;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 17px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 14px;
}

.upload {
  border: 2px dashed #49405f;
  border-radius: 14px;
  padding: 30px 12px;
  text-align: center;
  cursor: pointer;
  background: #1a1924;
}

.upload .symbol {
  font-size: 38px;
  margin-bottom: 12px;
}

.upload p {
  color: #aaa;
  font-size: 12px;
  margin-top: 8px;
}

#preview {
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: 12px;
  margin-top: 15px;
  display: none;
}

input[type="file"] {
  display: none;
}

textarea {
  width: 100%;
  min-height: 110px;
  background: #0c0c12;
  border: 1px solid #353542;
  border-radius: 12px;
  padding: 14px;
  color: white;
  font-size: 14px;
  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: #a855f7;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.generate {
  color: white;
  background: linear-gradient(100deg, #7c3aed, #a855f7);
}

.generate:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.download {
  background: #252532;
  color: white;
  margin-top: 12px;
  display: none;
}

.status {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-top: 14px;
}

footer {
  text-align: center;
  color: #555;
  font-size: 11px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">AI IMAGE <span>STUDIO</span></div>
  <div class="subtitle">PRIVATE AI IMAGE EDITOR</div>
</header>

<div class="card">
  <div class="section-title">01 — Seleccionar imagen</div>

  <label class="upload" for="imageInput">
    <div class="symbol">📷</div>
    <strong>Subir una fotografía</strong>
    <p>Selecciona una imagen de tu galería</p>
  </label>

  <input type="file" id="imageInput" accept="image/*">

  <img id="preview" alt="Vista previa">

  <div id="imageInfo" class="status"></div>
</div>

<div class="card">
  <div class="section-title">02 — Instrucciones</div>

  <textarea id="prompt"
    placeholder="Describe los cambios que quieres realizar en tu personaje adulto ficticio..."></textarea>
</div>

<div class="card">
  <div class="section-title">03 — Procesamiento</div>

  <button class="generate" id="generateBtn" disabled>
    ✨ GENERAR IMAGEN
  </button>

  <div class="status" id="status">
    Selecciona una imagen para comenzar.
  </div>

  <img id="result" alt="Imagen editada"
       style="width:100%;display:none;border-radius:12px;margin-top:15px;">

  <button class="download" id="downloadBtn">
    ↓ DESCARGAR IMAGEN
  </button>
</div>

<footer>
  AI IMAGE STUDIO © 2026
</footer>

</div>

<script>
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const imageInfo = document.getElementById("imageInfo");
const generateBtn = document.getElementById("generateBtn");
const statusText = document.getElementById("status");

let selectedImage = null;

imageInput.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "Selecciona un archivo de imagen válido.";
    return;
  }

  selectedImage = file;

  const url = URL.createObjectURL(file);

  preview.src = url;
  preview.style.display = "block";

  imageInfo.textContent =
    file.name + " · " + (file.size / 1024 / 1024).toFixed(2) + " MB";

  generateBtn.disabled = false;
  statusText.textContent = "Imagen cargada correctamente.";
});

generateBtn.addEventListener("click", function() {
  if (!selectedImage) return;

  statusText.textContent =
    "La interfaz está preparada. Falta conectar el servicio de IA.";

  alert("Todavía no hemos conectado el motor de inteligencia artificial.");
});
</script>

</body>
</html>
